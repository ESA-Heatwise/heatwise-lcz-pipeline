# Docker/CWL configuration for the HSI/LST preprocessing stage.
#
# EO input products are supplied separately through the pipeline
# `prep_input_catalog` Directory. The staged directory contains catalog.json,
# its STAC Item(s), and the referenced EO assets using relative hrefs.
#
# Supporting resources bundled with the heatwise-hsi-lst-prep processor
# image can still use absolute /app/... paths.

output_dir: "."
wavelength_file: /app/data/CHIME_v2_wavelengths_um.txt

process_lst: true
process_pca: false
sharpen_method: linear

band_trim_default:
  mode: keep
  ranges: "6-71,188-245"

lst_default:
  band: 7
  normalization: zscore

band_selection:
  keep_ranges: [[6, 71], [188, 245]]
  target_bands: 30
  target_clusters: 55
  vote_threshold: 0.5
  smoothness_cut_pct: 95
  n_sample: 20000
