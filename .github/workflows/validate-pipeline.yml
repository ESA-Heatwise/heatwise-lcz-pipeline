name: Validate and test LCZ pipeline

on:
  push:
    branches:
      - eoap-compliance
    paths:
      - "heatwise_pipeline.cwl"
      - "tools/**"
      - "scripts/**"
      - "docker/**"
      - "examples/**"
      - "data/**"
      - ".github/workflows/validate-pipeline.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cwltool "pystac[validation]"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/run_patch_extraction.py
          python -m py_compile scripts/run_predict.py

      - name: Validate preprocessing input STAC
        run: |
          python - <<'PY'
          import pystac

          catalog = pystac.Catalog.from_file(
              "data/Berlin_prep/catalog.json"
          )

          catalog.validate_all()
          print("Preprocessing input STAC is valid.")
          PY

      - name: Validate pipeline CWL
        run: cwltool --validate heatwise_pipeline.cwl

      - name: Validate vendored preprocessing CWL
        run: cwltool --validate tools/hsi_lst_prep.cwl

      - name: Validate patch extraction adapter CWL
        run: cwltool --validate tools/extract_patches_pipeline.cwl

      - name: Validate vendored training CWL
        run: cwltool --validate tools/lcz_train.cwl

      - name: Validate prediction adapter CWL
        run: cwltool --validate tools/predict_pipeline.cwl

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Pull upstream processor images
        run: |
          docker pull ghcr.io/esa-heatwise/heatwise-hsi-lst-prep:eoap-compliance
          docker pull ghcr.io/esa-heatwise/heatwise-patch-extraction:eoap-compliance
          docker pull ghcr.io/esa-heatwise/heatwise-lcz-classification:eoap-compliance

      - name: Verify upstream EOAP image interfaces
        run: |
          echo "=== HSI/LST preprocessing ==="
          docker run --rm \
            ghcr.io/esa-heatwise/heatwise-hsi-lst-prep:eoap-compliance \
            python /app/processor.py run-all --help \
            | grep -- "--input-catalog"

          echo "=== Patch extraction ==="
          docker run --rm \
            ghcr.io/esa-heatwise/heatwise-patch-extraction:eoap-compliance \
            python /app/processor.py --help \
            | grep -- "--input-catalog"

          echo "=== LCZ training ==="
          docker run --rm \
            ghcr.io/esa-heatwise/heatwise-lcz-classification:eoap-compliance \
            python /app/processor.py train --help \
            | grep -- "--input-catalog"

          echo "=== LCZ prediction ==="
          docker run --rm \
            ghcr.io/esa-heatwise/heatwise-lcz-classification:eoap-compliance \
            python /app/processor.py predict --help \
            | grep -- "--input-catalog"

          docker run --rm \
            ghcr.io/esa-heatwise/heatwise-lcz-classification:eoap-compliance \
            python /app/processor.py predict --help \
            | grep -- "--weights"

      - name: Build patch extraction pipeline image
        run: |
          docker build \
            -f docker/patch-extraction-pipeline.Dockerfile \
            -t ghcr.io/heatwise-lcz/heatwise-patch-extraction-pipeline:0.1.1 \
            .

      - name: Build LCZ prediction pipeline image
        run: |
          docker build \
            -f docker/lcz-classification-pipeline.Dockerfile \
            -t ghcr.io/esa-heatwise/heatwise-lcz-classification-pipeline:eoap-compliance \
            .

      - name: Run full CWL pipeline
        run: |
          mkdir -p cwl-output

          cwltool \
            --outdir cwl-output \
            heatwise_pipeline.cwl \
            examples/job.yaml

      - name: Validate generated STAC catalogs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pystac

          catalogs = list(Path("cwl-output").rglob("catalog.json"))

          if not catalogs:
              raise RuntimeError(
                  "No output catalog.json files were generated"
              )

          for catalog_path in catalogs:
              print(f"Validating {catalog_path}")
              catalog = pystac.Catalog.from_file(str(catalog_path))
              catalog.validate_all()

          print(
              f"Validated {len(catalogs)} generated STAC catalog(s)."
          )
          PY

      - name: Check pipeline products
        run: |
          PATCH_COUNT=$(find cwl-output -type f -name "patches.h5" | wc -l)
          MODEL_COUNT=$(find cwl-output -type f -name "best_model_*.pth" | wc -l)
          SUMMARY_COUNT=$(find cwl-output -type f -name "summary.csv" | wc -l)
          MAP_COUNT=$(find cwl-output -type f -name "lcz_map.tif" | wc -l)

          if [ "$PATCH_COUNT" -lt 1 ]; then
            echo "No patch HDF5 product was generated"
            exit 1
          fi

          if [ "$MODEL_COUNT" -lt 1 ]; then
            echo "No trained model checkpoint was generated"
            exit 1
          fi

          if [ "$SUMMARY_COUNT" -lt 1 ]; then
            echo "No training summary.csv was generated"
            exit 1
          fi

          if [ "$MAP_COUNT" -lt 1 ]; then
            echo "No final LCZ map was generated"
            exit 1
          fi

          echo "=== Patch products ==="
          find cwl-output -type f -name "patches.h5" -print

          echo "=== Model checkpoints ==="
          find cwl-output -type f -name "best_model_*.pth" -print

          echo "=== Training summaries ==="
          find cwl-output -type f -name "summary.csv" -print

          echo "=== Final LCZ maps ==="
          find cwl-output -type f -name "lcz_map.tif" -print

          echo "=== Prediction previews ==="
          find cwl-output -type f -name "lcz_map_preview.png" -print || true

      - name: Show generated outputs
        if: always()
        run: |
          echo "=== Generated files ==="
          find cwl-output -maxdepth 8 -type f -print | sort || true

          echo "=== STAC catalogs ==="
          find cwl-output -name "catalog.json" -print || true
