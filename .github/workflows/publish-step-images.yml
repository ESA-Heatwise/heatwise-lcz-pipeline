name: Build and publish Pipeline component Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (default: eoap-compliance)"
        required: false
        default: eoap-compliance
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: esa-heatwise

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - step: heatwise-patch-extraction-pipeline
            dockerfile: docker/patch-extraction-pipeline.Dockerfile
          - step: heatwise-lcz-classification-pipeline
            dockerfile: docker/lcz-classification-pipeline.Dockerfile
          # heatwise-hsi-lst-prep and heatwise-lcz-classification are published independently
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.step }}:${{ inputs.tag || 'eoap-compliance' }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.step }}:${{ github.sha }}
